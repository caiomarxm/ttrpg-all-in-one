services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ttrpg
      POSTGRES_PASSWORD: ttrpg
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ttrpg -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g

  pgadmin:
    image: dpage/pgadmin4:8
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./infra/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./infra/pgadmin/pgpass:/pgpass:ro
    deploy:
      resources:
        limits:
          memory: 512m

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "${NATS_CLIENT_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:8222/varz >/dev/null || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1g

  centrifugo:
    image: centrifugo/centrifugo:v6
    depends_on:
      nats:
        condition: service_healthy
    command: ["centrifugo", "--config=/centrifugo/config.json"]
    ports:
      - "${CENTRIFUGO_HTTP_PORT:-8000}:8000"
    volumes:
      - ./infra/centrifugo/config.json:/centrifugo/config.json:ro
    deploy:
      resources:
        limits:
          memory: 1g

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:-minio}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:-minio-dev-password}"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 1g

  faster-whisper-server:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    ports:
      - "${WHISPER_SERVER_PORT:-8010}:8000"
    volumes:
      - faster_whisper_cache:/root/.cache/huggingface
    deploy:
      resources:
        limits:
          memory: 4g

  migrate:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SESSION_TRANSCRIPTION_DATABASE_URL: postgresql+psycopg://ttrpg:ttrpg@postgres:5432/session_transcription
      CAMPAIGNS_DATABASE_URL: postgresql+psycopg://ttrpg:ttrpg@postgres:5432/campaigns
      WIKI_DATABASE_URL: postgresql+psycopg://ttrpg:ttrpg@postgres:5432/wiki
    entrypoint: ["/bin/sh", "/workspace/app/api/scripts/docker-migrate.sh"]

  api:
    build:
      context: .
      dockerfile: app/api/Dockerfile
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio:
        condition: service_healthy
      faster-whisper-server:
        condition: service_started
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./data/recordings:/data/recordings
    environment:
      SESSION_TRANSCRIPTION_DATABASE_URL: postgresql+psycopg://ttrpg:ttrpg@postgres:5432/session_transcription
      SESSION_TRANSCRIPTION_RECORDINGS_DIR: /data/recordings
      SESSION_TRANSCRIPTION_WHISPER_BASE_URL: http://faster-whisper-server:8000/v1
      SESSION_TRANSCRIPTION_WHISPER_API_KEY: local-dev
      SESSION_TRANSCRIPTION_STORAGE_ENDPOINT_URL: http://minio:9000
      SESSION_TRANSCRIPTION_STORAGE_ACCESS_KEY: minio
      SESSION_TRANSCRIPTION_STORAGE_SECRET_KEY: minio-dev-password
      SESSION_TRANSCRIPTION_STORAGE_BUCKET: ttrpg-recordings
    deploy:
      resources:
        limits:
          memory: 1g

  escriba:
    build:
      context: ./app/discord/escriba
      dockerfile: Dockerfile
    env_file: ./app/discord/escriba/.env
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "${ESCRIBA_PORT:-3000}:3000"
    volumes:
      - ./data/recordings:/data/recordings
    environment:
      PORT: 3000
      RECORDINGS_DIR: /data/recordings
      TRANSCRIPTION_API_URL: http://api:8080/session-transcription
    deploy:
      resources:
        limits:
          memory: 1g

  cronista:
    build:
      context: ./app/discord/cronista
      dockerfile: Dockerfile
    env_file: ./app/discord/cronista/.env
    restart: unless-stopped
    depends_on:
      - escriba
    volumes:
      - ./app/discord/cronista:/workspace/app
    environment:
      RECORDER_URL: http://escriba:3000
    command: >
      python -m watchfiles
      "python /workspace/app/entrypoints/bot.py"
      /workspace/app
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  postgres_data:
  pgadmin_data:
  nats_data:
  minio_data:
  faster_whisper_cache:
