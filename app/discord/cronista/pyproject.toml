[project]
name = "cronista-bot"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "davey>=0.1.5",
    "py-cord==2.8.0rc2",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pynacl>=1.6.2",
    "watchfiles>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pre-commit>=4.6.0",
    "ruff>=0.15.13",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
pythonpath = ["."]
