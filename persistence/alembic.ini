[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../app/api
version_path_separator = os
; Bootstrap section only — always pass -n <bc> for real commands.
sqlalchemy.url = postgresql+psycopg://ttrpg:ttrpg@localhost:5432/postgres

[campaigns]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../app/api
version_path_separator = os
version_locations = %(here)s/../app/api/modules/campaigns/persistence/migration/versions

[wiki]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../app/api
version_path_separator = os
version_locations = %(here)s/../app/api/modules/wiki/persistence/migration/versions

[session_transcription]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s/../app/api
version_path_separator = os
version_locations = %(here)s/../app/api/modules/session_transcription/persistence/migration/versions

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
